plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// On GitHub Actions GITHUB_RUN_NUMBER grows with every build, so each APK is a newer version
// and installs over the previous one. Locally it falls back to 1.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.example.codexterminal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.codexterminal'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // The same sideload key signs every build, so each new APK can update the previous one.
    signingConfigs {
        debug {
            storeFile file('sideload.keystore')
            storePassword 'codexterminal'
            keyAlias 'codexterminal'
            keyPassword 'codexterminal'
        }
    }

    packaging {
        jniLibs {
            // Android extracts libcodex.so into nativeLibraryDir, where it can be executed.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
