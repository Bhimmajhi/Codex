name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          # GitHub's Ubuntu runner already has the Android SDK installed in $ANDROID_HOME.
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Codex arm64 binary from npm
        run: |
          set -euo pipefail
          VERSION="$(npm view @openai/codex version)"
          echo "Using @openai/codex ${VERSION}"
          WORK_DIR="$RUNNER_TEMP/codex-npm"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          npm pack "@openai/codex@${VERSION}-linux-arm64"
          tar -xzf openai-codex-*.tgz
          SOURCE_BINARY="$(find package -type f -path '*aarch64-unknown-linux-musl/bin/codex' | head -n 1)"
          test -n "$SOURCE_BINARY"
          JNI_DIR="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          cp "$SOURCE_BINARY" "$JNI_DIR/libcodex.so"
          chmod 755 "$JNI_DIR/libcodex.so"
          ls -lh "$JNI_DIR/libcodex.so"

      - name: Fetch CA certificate bundle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fsSL https://curl.se/ca/cacert.pem -o app/src/main/assets/cacert.pem

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-terminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk codex-terminal.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" codex-terminal.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Terminal ${TAG}" \
            --notes "Built from commit ${GITHUB_SHA}."
